name: 缺陷报告 / Bug report
description: 报告可复现的功能或质量缺陷（不含法律咨询）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请注意：
        - 本仓库**不提供法律咨询**；法律问题请联系 12348 或执业律师。
        - 不要粘贴真实合同、案件材料、个人信息、密钥或令牌。
        - 复现步骤请注明是源码运行还是 GitHub Pages 静态站（Pages 无后端能力）。
  - type: textarea
    id: what-happened
    attributes:
      title: 发生了什么 / What happened
      description: 现象与预期差异；含最小复现步骤
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      title: 使用面 / Surface
      options:
        - 源码本机运行（server + web）
        - GitHub Pages 静态站
        - 桌面候选包
        - 文档 / README
    validations:
      required: true
  - type: input
    id: version
    attributes:
      title: 版本或提交 / Version or commit
      placeholder: v1.1.0-rc.1 或 commit hash
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      title: 证据 / Evidence
      description: 截图（脱敏）、console 输出、网络请求（去除令牌）等
  - type: checkboxes
    id: attest
    attributes:
      label: 确认 / Attestation
      options:
        - label: 我确认本报告不含个人信息、案件材料或密钥
          required: true
