name: desktop-release

# 桌面端 release：Electron 壳 + PyInstaller 后端 sidecar
# tag 推送 → 三平台构建 → GitHub Release 附产物
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            artifact_name: backend-windows
          - os: ubuntu-latest
            sep: ':'
            artifact_name: backend-linux
          - os: macos-latest
            sep: ':'
            artifact_name: backend-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server deps
        run: pip install fastapi "uvicorn[standard]" rank-bm25 python-docx httpx python-multipart pyinstaller

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../server/desktop-dist/web
          cp -r dist/* ../server/desktop-dist/web/

      - name: PyInstaller backend sidecar
        shell: bash
        run: |
          cd server
          mkdir -p desktop-dist/web
          if [ -d "../web/dist" ]; then
            cp -r ../web/dist/* desktop-dist/web/
          fi
          pyinstaller --name legalhigh-backend --contents-directory . \
            --add-data "data${{ matrix.sep }}app_data" \
            --add-data "desktop-dist/web${{ matrix.sep }}web" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import app.main \
            desktop_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.artifact_name }}
          path: server/dist/legalhigh-backend*/

  desktop:
    needs: backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: backend-windows
          - os: ubuntu-latest
            artifact_name: backend-linux
          - os: macos-latest
            artifact_name: backend-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.artifact_name }}
          path: desktop/backend

      - name: Materialize launcher from template
        working-directory: desktop
        run: cp main.js.in main.js

      - name: Electron package + Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npx electron-builder --publish always
