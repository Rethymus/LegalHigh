# LegalHigh 云端质量门——本文件配置后仍须以实际 Actions 运行记录为准。
# 说明（决策项3·选项C）：本文件为「就绪待启用」状态——仅当代码推送到 GitHub 等远端时
# 才会生效；数据/代码是否托管属业主决策（决策清单-2026-08-30.md 决策3），本地不受影响。
# 视觉巡检需要同时启动隔离后端、Vite 与 Chrome，目前由本地终验执行，不在本工作流中伪装为已覆盖。
name: qa

on:
  push:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server deps
        run: |
          cd server
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock

      - name: Gate 1 pytest（含金标 100 组评测门）
        run: |
          cd server
          .venv/bin/python -m pytest tests -q

      - name: Gate 2 web build（tsc + vite）
        run: |
          cd web
          npm ci
          npm run build

      - name: Gate 3 data-discipline grep
        run: |
          cd web
          node scripts/qa_gates.mjs

      - name: Gate 4 WCAG contrast（--strict）
        run: |
          cd web
          node scripts/qa_contrast.mjs --strict

      - name: Gate 5 Python dependency audit
        run: |
          cd server
          .venv/bin/pip-audit -r requirements.lock

      - name: Gate 6 npm dependency audits
        run: |
          cd web
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          cd ../desktop
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
