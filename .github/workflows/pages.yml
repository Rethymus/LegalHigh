name: pages

# GitHub Pages 静态预览（决策 8 执行件）：VITE_DEMO=1 构建只读演示站
# —— 浏览器内置演示 API（JS BM25 复刻 + 快照数据），写入功能诚实降级为 501 引导桌面端
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          cd web && npm ci
          pip install rank-bm25

      - name: Generate demo data (evals snapshot from gold×corpus)
        run: |
          cd server
          python scripts/gen_demo_evals.py
          cp data/cases.json ../web/public/data/cases.json

      - name: Build demo bundle
        env:
          VITE_DEMO: '1'
        run: |
          cd web
          npx vite build --outDir dist-demo --emptyOutDir
          cp public/data/cases.json public/data/evals.json dist-demo/data/
          # SPA 回退：GitHub Pages 对未知路径返回 404.html → React Router 接管路由
          cp dist-demo/index.html dist-demo/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
