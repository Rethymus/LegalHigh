name: pages

# GitHub Pages 静态说明站：只发布前端壳与法规证据快照。
# 不复制 server 检索逻辑，不拦截 /api，也不把浏览器内结果冒充正式服务。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build static documentation bundle
        env:
          VITE_STATIC_PREVIEW: '1'
        working-directory: web
        run: |
          npx tsc -b
          node scripts/qa_gates.mjs
          node scripts/qa_contrast.mjs --strict
          npx vite build --outDir dist-pages --emptyOutDir
          # SPA 回退：GitHub Pages 对未知路径返回 404.html → React Router 接管路由
          cp dist-pages/index.html dist-pages/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
